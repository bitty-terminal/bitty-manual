name: Continuous Delivery to Cloudflare R2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-manual-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Package and Deploy to R2
    runs-on: ubuntu-latest
    # Worst case with UPLOAD_ATTEMPTS=3 backoff is ~12.6 min (288/4 x 10.5 s),
    # so the job must outlive the retry budget or a timeout can skip the
    # always() verification step entirely.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Just
        uses: extractions/setup-just@v2

      - name: Setup Actionlint
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin actionlint

      - name: Run Quality Gates
        run: just check

      - name: Deploy to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: just upload-r2

      - name: Verify published keys
        # Always run: an upload failure must not skip verification, otherwise a
        # missing or stale key could ship behind a "deploy failed" message.
        if: always()
        # No R2 listing primitive is available (wrangler get/put/delete
        # only), so verification fetches the expected canonical + legacy
        # keys over public HTTPS. Uses only the public CDN base: no secrets.
        run: |
          base="https://cdn.bitty.run/manual/bitty-manual"
          legacy="https://cdn.bitty.run/manual"
          curl -fsSL --retry 3 --retry-delay 10 "$base/manifest.json" -o /dev/null
          curl -fsSL --retry 3 --retry-delay 10 "$base/en.tar.gz" -o /dev/null
          curl -fsSL --retry 3 --retry-delay 10 "$base/zh-CN.tar.gz" -o /dev/null
          curl -fsSL --retry 3 --retry-delay 10 "$legacy/manifest.json" -o /dev/null
          echo "Published keys verified (canonical + legacy compat)."
